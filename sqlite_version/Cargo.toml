[package]
name = "opencode-rs"
version = "1.18.25"
edition = "2021"
authors = ["Daniel @ DevFort.pl"]
description = "DevFort.pl OpenCode-RS 1.18.25 — Universal Terminal AI Coding Agent in Rust (OpenCode 1.18.25 compatible)"
repository = "https://github.com/devfortsystems/OpenCode-RS"
homepage = "https://github.com/devfortsystems/OpenCode-RS"
readme = "README.md"
license = "MIT"
keywords = ["ai", "tui", "rust", "coding-assistant", "opencode"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
anyhow = "1.0"
thiserror = "2.0"
similar = { version = "2.6", features = ["inline"] }
ignore = "0.4"
portable-pty = "0.8"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.0"
directories = "6.0"
async-trait = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
dotenvy = "0.15"
agent-client-protocol = "2.0"
syntect = "5.2"
syntect-tui = "3.0"

# SQLite embedded — otwarta wbudowana baza danych (ACID, JSON, FTS5)
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
