name: Rust CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: cargo test --verbose

  release:
    name: Build & Release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: opencode-rs.exe
            artifact_name: opencode-rs-windows-x86_64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: opencode-rs
            artifact_name: opencode-rs-linux-x86_64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: opencode-rs
            artifact_name: opencode-rs-macos-x86_64.tar.gz

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Set up Node for bridge
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: bridge-extension/package-lock.json

    - name: Build bridge VSIX
      run: |
        npm --prefix bridge-extension ci
        npx --prefix bridge-extension @vscode/vsce package -o opencode-rs-bridge-${{ matrix.target }}.vsix

    - name: Build release
      run: cargo build --release --target ${{ matrix.target }}

    - name: Package Windows
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.binary_name }} -DestinationPath ${{ matrix.artifact_name }}
        Compress-Archive -Path opencode-rs-bridge-${{ matrix.target }}.vsix -Update -DestinationPath ${{ matrix.artifact_name }}

    - name: Package Unix
      if: matrix.os != 'windows-latest'
      run: |
        tar -czf ${{ matrix.artifact_name }} -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}
        tar -czf bridge-${{ matrix.target }}.vsix.tar.gz opencode-rs-bridge-${{ matrix.target }}.vsix

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ matrix.artifact_name }}
          opencode-rs-bridge-${{ matrix.target }}.vsix
          bridge-${{ matrix.target }}.vsix.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
