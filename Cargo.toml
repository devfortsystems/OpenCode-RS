[package]
name = "opencode-rs"
version = "1.18.23"
edition = "2021"
authors = ["Daniel @ DevFort.pl"]
description = "DevFort.pl OpenCode-RS 1.18.23 — Universal Terminal AI Coding Agent in Rust (OpenCode 1.18.23 compatible)"
repository = "https://github.com/devfortsystems/OpenCode-RS"
homepage = "https://github.com/devfortsystems/OpenCode-RS"
readme = "README.md"
license = "MIT"
keywords = ["ai", "tui", "rust", "coding-assistant", "opencode"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
similar = { version = "2.6", features = ["inline"] }
ignore = "0.4"
portable-pty = "0.8"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.0"
directories = "6.0"
async-trait = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
